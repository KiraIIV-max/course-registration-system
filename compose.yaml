name: course-registration-system

services:

  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    image: course-registration/discovery-server:0.0.2
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - course-registration-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: course-registration/api-gateway:0.0.2
    container_name: api-gateway
    ports:
      - "8090:8090"
    command:
      - "--server.port=8090"
      - "--eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/"
    depends_on:
      - discovery-server
    networks:
      - course-registration-network
    restart: unless-stopped

networks:
  course-registration-network:
    driver: bridge
